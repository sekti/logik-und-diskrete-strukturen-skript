name: Build PDF and update release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Compile skript.pdf
        run: typst compile --input kapitel=alle skript.typ skript.pdf

      - name: Upload PDF to latest release (create one if none exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          if [ -n "$tag" ]; then
            echo "Updating latest release: $tag"
            gh release upload "$tag" skript.pdf --clobber
          else
            echo "No release yet, creating one"
            gh release create latest skript.pdf \
              --target "$GITHUB_SHA" \
              --title "Aktuelle Fassung" \
              --notes "Automatisch erzeugte PDF-Fassung des Skripts."
          fi
