name: Build PDF and update release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Compile skript.pdf
        run: typst compile --input folien=false --input kapitel=alle skript.typ skript.pdf

      - name: Upload PDF to release "latest" (create it if it does not exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "Updating release: latest"
            gh release upload latest skript.pdf --clobber
          else
            echo "No release yet, creating one"
            gh release create latest skript.pdf \
              --target "$GITHUB_SHA" \
              --title "Aktuelle Fassung" \
              --notes "Automatisch erzeugte PDF-Fassung des Skripts."
          fi
